                  hideLoadingView()
                  loadingView = LayoutInflater.from(this).inflate(R.layout.floating_loading, null)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  
                  loadingView!!.findViewById<TextView>(R.id.tvLoadingText).text = message
                  
                  val btnHide = loadingView!!.findViewById<Button>(R.id.btnHideLoading)
                  if (canHide) {
                      btnHide.visibility = View.VISIBLE
                      btnHide.setOnClickListener {
                          hideLoadingView()
                          closeMenu()
                          isHidden = true
                          bubbleView.alpha = 0.01f
                          Toast.makeText(this, "Asisten disembunyikan. (Klik 2x di posisi robot untuk memunculkan)", Toast.LENGTH_LONG).show()
                      }
                  } else {
                      btnHide.visibility = View.GONE
                  }

                  windowManager.addView(loadingView, params)
