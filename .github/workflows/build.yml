              private fun closeMenu() {
                  if (menuView != null) {
                      try { windowManager.removeView(menuView) } catch (_: Exception) {}
                      menuView = null
                  }
              }

              private fun closeAnswer() {
                  if (answerView != null) {
                      try { windowManager.removeView(answerView) } catch (_: Exception) {}
                      answerView = null
