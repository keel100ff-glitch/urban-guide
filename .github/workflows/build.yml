          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class FloatingService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var bubbleView: View
              private var answerView: View? = null
              private var menuView: View? = null
              private var loadingView: View? = null
              private var scanView: View? = null
              
              private var API_KEY = ""
              private var isHidden = false
              private var lastAnswer = ""
              private var isNotifEnabled = false
              private var notifMode = "SINGKAT" 
              private var lastClipboardText = ""
              
              private var featJawab = true
              private var featPenjelasan = true
              private var featEsai = true
              private var featScan = true
              private var featAutoCopy = true

              private var scanRect: Rect? = null
              private var currentMode = ""

              private var cooldownEndTime = 0L
              private var cooldownHandler = Handler(Looper.getMainLooper())
              private var cooldownRunnable: Runnable? = null

              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null

              private val clipboardListener = object : ClipboardManager.OnPrimaryClipChangedListener {
                  override fun onPrimaryClipChanged() {
                      if (isNotifEnabled) {
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          val clip = clipboard.primaryClip
                          if (clip != null && clip.itemCount > 0) {
                              val text = clip.getItemAt(0).text?.toString() ?: ""
                              if (text.isNotBlank() && text != lastClipboardText && text != lastAnswer) {
                                  lastClipboardText = text
                                  askAIWithText(text, notifMode)
                              }
                          }
                      }
                  }
              }

              private val notificationActionReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          "COPY_ALL_ANSWER" -> {
                              if (lastAnswer.isNotEmpty()) {
                                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                  cm.setPrimaryClip(ClipData.newPlainText("Belajar", lastAnswer))
                                  Toast.makeText(this@FloatingService, "Semua teks disalin!", Toast.LENGTH_SHORT).show()
                              }
                          }
                          "COPY_JUST_ANSWER" -> {
                              if (lastAnswer.isNotEmpty()) {
                                  val ans = extractAnswerOnly(lastAnswer)
                                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                  cm.setPrimaryClip(ClipData.newPlainText("Belajar", ans))
                                  Toast.makeText(this@FloatingService, "Jawaban disalin: $ans", Toast.LENGTH_SHORT).show()
                              }
                          }
                          "CHANGE_MODE" -> {
                              notifMode = if (notifMode == "ESAI") "SINGKAT" else "ESAI"
                              showResultNotification(lastAnswer) 
                              Toast.makeText(this@FloatingService, "Mode diubah ke: $notifMode", Toast.LENGTH_SHORT).show()
                          }
                          "OFF_AUTO_COPY" -> {
                              isNotifEnabled = false
                              getSystemService(NotificationManager::class.java).cancel(3) 
                              Toast.makeText(this@FloatingService, "Fitur Notifikasi dimatikan.", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              private val stopReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      cleanupAndStop()
                  }
              }

              private val projectionCallback = object : MediaProjection.Callback() {
                  override fun onStop() {
                      releaseProjection()
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val prefs = getSharedPreferences("FloatAIPrefs", MODE_PRIVATE)
                  API_KEY = prefs.getString("api_key", "") ?: ""
                  
                  featJawab = prefs.getBoolean("feat_jawab", true)
                  featPenjelasan = prefs.getBoolean("feat_penjelasan", true)
                  featEsai = prefs.getBoolean("feat_esai", true)
                  featScan = prefs.getBoolean("feat_scan", true)
                  featAutoCopy = prefs.getBoolean("feat_autocopy", true)

                  registerReceivers()
                  startForegroundNotification()
                  showBubble()

                  val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  clipboard.addPrimaryClipChangedListener(clipboardListener)
              }

              private fun registerReceivers() {
                  val filterStop = IntentFilter("STOP_ROBOT")
                  val filterNotif = IntentFilter().apply {
                      addAction("COPY_ALL_ANSWER")
                      addAction("COPY_JUST_ANSWER")
                      addAction("CHANGE_MODE")
                      addAction("OFF_AUTO_COPY")
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(stopReceiver, filterStop, Context.RECEIVER_NOT_EXPORTED)
                      registerReceiver(notificationActionReceiver, filterNotif, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(stopReceiver, filterStop)
                      registerReceiver(notificationActionReceiver, filterNotif)
                  }
              }

              private fun startForegroundNotification() {
                  val channelId = "float_ai_service"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId, "Service Belajar", NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(channel)
                  }

                  val intentOpen = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pendingIntentOpen = PendingIntent.getActivity(
                      this, 0, intentOpen, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val builder: Notification.Builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }

                  val notif: Notification = builder
                      .setContentTitle("Asisten Belajar")
                      .setContentText("Siap membantu. Klik untuk buka app.")
                      .setSmallIcon(R.drawable.ic_notification)
                      .setContentIntent(pendingIntentOpen)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notif, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notif)
                  }
              }

              private fun showResultNotification(answerText: String) {
                  val channelId = "hasil_ai_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId, "Hasil Jawaban AI", NotificationManager.IMPORTANCE_HIGH
                      )
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(channel)
                  }

                  val intentCopyAll = Intent("COPY_ALL_ANSWER")
                  val pendingCopyAll = PendingIntent.getBroadcast(this, 10, intentCopyAll, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)

                  val intentCopyJust = Intent("COPY_JUST_ANSWER")
                  val pendingCopyJust = PendingIntent.getBroadcast(this, 11, intentCopyJust, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)

                  val intentChangeMode = Intent("CHANGE_MODE")
                  val pendingChangeMode = PendingIntent.getBroadcast(this, 12, intentChangeMode, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)

                  val intentOff = Intent("OFF_AUTO_COPY")
                  val pendingOff = PendingIntent.getBroadcast(this, 13, intentOff, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)

                  val judul = "Nesia AI [AUTO • ${notifMode.uppercase()}] — Ketuk Salin"
                  
                  val builder = NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(R.drawable.ic_notification)
                      .setContentTitle(judul)
                      .setContentText(answerText)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(answerText))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .addAction(0, "Salin", pendingCopyAll)
                      .addAction(0, "Salin Jawaban", pendingCopyJust)
                      .addAction(0, "Ubah Mode", pendingChangeMode)
                      .addAction(0, "OFF", pendingOff)

                  getSystemService(NotificationManager::class.java).notify(3, builder.build())
              }

              private fun cleanupAndStop() {
                  closeMenu()
                  closeScan()
                  closeAnswer()
                  hideLoadingView()
                  if (::bubbleView.isInitialized) {
                      try { windowManager.removeView(bubbleView) } catch (_: Exception) {}
                  }
                  val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  clipboard.removePrimaryClipChangedListener(clipboardListener)
                  releaseProjection()
                  stopSelf()
              }

              private fun releaseProjection() {
                  try { virtualDisplay?.release() } catch (_: Exception) {}
                  virtualDisplay = null
                  try { imageReader?.close() } catch (_: Exception) {}
                  imageReader = null
                  try { mediaProjection?.stop() } catch (_: Exception) {}
                  mediaProjection = null
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { unregisterReceiver(stopReceiver) } catch (_: Exception) {}
                  try { unregisterReceiver(notificationActionReceiver) } catch (_: Exception) {}
                  releaseProjection()
                  cooldownRunnable?.let { cooldownHandler.removeCallbacks(it) }
              }

              private fun showBubble() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  bubbleView = LayoutInflater.from(this).inflate(R.layout.floating_bubble, null)
                  val params = WindowManager.LayoutParams(
                      150, 150,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = 100
                  params.y = 300

                  val floatAnim = AnimationUtils.loadAnimation(this, R.anim.floating_anim)
                  bubbleView.startAnimation(floatAnim)

                  bubbleView.setOnTouchListener(object : View.OnTouchListener {
                      var initialX = 0
                      var initialY = 0
                      var touchX = 0f
                      var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x
                                  initialY = params.y
                                  touchX = event.rawX
                                  touchY = event.rawY
                                  return false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initialX + (event.rawX - touchX).toInt()
                                  params.y = initialY + (event.rawY - touchY).toInt()
                                  try { windowManager.updateViewLayout(bubbleView, params) } catch (_: Exception) {}
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  var clickCount = 0
                  var lastClickTime = 0L
                  
                  bubbleView.setOnClickListener {
                      val currentTime = System.currentTimeMillis()
                      if (currentTime - lastClickTime < 400) {
                          clickCount++
                      } else {
                          clickCount = 1
                      }
                      lastClickTime = currentTime

                      Handler(Looper.getMainLooper()).postDelayed({
                          if (System.currentTimeMillis() - lastClickTime >= 400) {
                              when (clickCount) {
                                  1 -> {
                                      if (isHidden) {
                                          isHidden = false
                                          bubbleView.alpha = 1.0f
                                      } else {
                                          showMenu()
                                      }
                                   }
                                  4 -> {
                                      Toast.makeText(this@FloatingService, "Asisten dimatikan total!", Toast.LENGTH_SHORT).show()
                                      cleanupAndStop()
                                  }
                              }
                              clickCount = 0
                          }
                      }, 400)
                  }
                  windowManager.addView(bubbleView, params)
              }

