              private fun openScanScreen(mode: String) {
                  currentMode = mode
                  if (scanView != null) return
                  
                  scanView = LayoutInflater.from(this).inflate(R.layout.floating_scan, null)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  windowManager.addView(scanView, params)

                  val scanBox = scanView!!.findViewById<FrameLayout>(R.id.scanBox)
                  val resizeHandle = scanView!!.findViewById<android.widget.ImageView>(R.id.resizeHandle)
                  val btnDoScan = scanView!!.findViewById<Button>(R.id.btnDoScan)
                  val btnCancel = scanView!!.findViewById<Button>(R.id.btnCancelScan)

                  scanBox.setOnTouchListener(object : View.OnTouchListener {
                      var initialX = 0
                      var initialY = 0
                      var touchX = 0f
                      var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          val boxParams = scanBox.layoutParams as FrameLayout.LayoutParams
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = boxParams.leftMargin
                                  initialY = boxParams.topMargin
                                  touchX = event.rawX
                                  touchY = event.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  boxParams.leftMargin = initialX + (event.rawX - touchX).toInt()
                                  boxParams.topMargin = initialY + (event.rawY - touchY).toInt()
                                  scanBox.layoutParams = boxParams
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  resizeHandle.setOnTouchListener(object : View.OnTouchListener {
                      var initialWidth = 0
                      var initialHeight = 0
                      var touchX = 0f
                      var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          val boxParams = scanBox.layoutParams as FrameLayout.LayoutParams
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialWidth = boxParams.width
                                  initialHeight = boxParams.height
                                  touchX = event.rawX
                                  touchY = event.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val newWidth = initialWidth + (event.rawX - touchX).toInt()
                                  val newHeight = initialHeight + (event.rawY - touchY).toInt()
                                  
                                  boxParams.width = newWidth.coerceAtLeast(100)
                                  boxParams.height = newHeight.coerceAtLeast(100)
                                  scanBox.layoutParams = boxParams
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  btnCancel.setOnClickListener { closeScan() }
                  btnDoScan.setOnClickListener {
                      val location = IntArray(2)
                      scanBox.getLocationOnScreen(location)
                      scanRect = Rect(location[0], location[1], location[0] + scanBox.width, location[1] + scanBox.height)
                      closeScan()
                      checkCooldownAndProceed(mode)
                  }
              }

              private fun closeScan() {
                  if (scanView != null) {
                      try { windowManager.removeView(scanView) } catch (_: Exception) {}
                      scanView = null
                  }
              }

              private fun checkCooldownAndProceed(mode: String) {
                  val currentTime = System.currentTimeMillis()
                  if (currentTime < cooldownEndTime) {
                      val remainingSeconds = ((cooldownEndTime - currentTime) / 1000).toInt() + 1
                      showLoadingWithMessage("Tunggu limit AI...\n${remainingSeconds} detik lagi", true)
                      
                      cooldownRunnable?.let { cooldownHandler.removeCallbacks(it) }
                      cooldownRunnable = object : Runnable {
                          override fun run() {
                              val now = System.currentTimeMillis()
                              if (now >= cooldownEndTime) {
                                  hideLoadingView()
                                  Toast.makeText(this@FloatingService, "Waktu tunggu habis! Silakan klik menu lagi.", Toast.LENGTH_SHORT).show()
                              } else {
                                  val sec = ((cooldownEndTime - now) / 1000).toInt() + 1
                                  (loadingView?.findViewById<TextView>(R.id.tvLoadingText))?.text = "Tunggu limit AI...\n${sec} detik lagi"
                                  cooldownHandler.postDelayed(this, 1000)
                              }
                          }
                      }
                      cooldownHandler.postDelayed(cooldownRunnable!!, 1000)
                      return
                  }
                  
                  cooldownEndTime = 0L 
                  showLoadingAndCapture(mode)
              }

