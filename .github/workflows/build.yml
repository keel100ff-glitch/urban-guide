name: Build APK Belajar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/floatai
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/anim

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Belajar"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.floatai'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.floatai"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
          }
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:label="Belajar"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FloatingService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/app_icon.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#4CAF50" android:pathData="M25,30 L50,30 L50,80 L25,80 C22,80 20,78 20,75 L20,35 C20,32 22,30 25,30 Z"/>
              <path android:fillColor="#388E3C" android:pathData="M50,30 L83,30 C86,30 88,32 88,35 L88,75 C88,78 86,80 83,80 L50,80 Z"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="2" android:pathData="M28,40 L42,40 M28,50 L42,50 M28,60 L42,60"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="2" android:pathData="M56,40 L80,40 M56,50 L80,50 M56,60 L80,60"/>
              <path android:fillColor="#FFC107" android:pathData="M70,20 L85,35 L75,45 L60,30 Z"/>
              <path android:fillColor="#FF5722" android:pathData="M58,32 L60,30 L75,45 L73,47 Z"/>
              <path android:fillColor="#333333" android:pathData="M56,34 L58,32 L60,34 L58,36 Z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_pen.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFC107" android:pathData="M3,17.25V21h3.75L17.81,9.94l-3.75,-3.75L3,17.25z"/>
              <path android:fillColor="#FF5722" android:pathData="M20.71,7.04c0.39,-0.39 0.39,-1.02 0,-1.41l-2.34,-2.34c-0.39,-0.39 -1.02,-0.39 -1.41,0l-1.83,1.83 3.75,3.75 1.83,-1.83z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_book.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#4CAF50" android:pathData="M18,2H6c-1.1,0 -2,0.9 -2,2v16c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2V4c0,-1.1 -0.9,-2 -2,-2zM6,4h5v8l-2.5,-1.5L6,12V4z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_chat.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#2196F3" android:pathData="M20,2H4c-1.1,0 -2,0.9 -2,2v18l4,-4h14c1.1,0 2,-0.9 2,-2V4c0,-1.1 -0.9,-2 -2,-2z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_search.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FF9800" android:pathData="M15.5,14h-0.79l-0.28,-0.27C15.41,12.59 16,11.11 16,9.5 16,5.91 13.09,3 9.5,3S3,5.91 3,9.5 5.91,16 9.5,16c1.61,0 3.09,-0.59 4.23,-1.57l0.27,0.28v0.79l5,4.99L20.49,19l-4.99,-5zM9.5,14C7.01,14 5,11.99 5,9.5S7.01,5 9.5,5 14,7.01 14,9.5 11.99,14 9.5,14z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_clipboard.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#9C27B0" android:pathData="M19,2h-4.18C14.4,0.84 13.3,0 12,0c-1.3,0 -2.4,0.84 -2.82,2H5c-1.1,0 -2,0.9 -2,2v16c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2V4c0,-1.1 -0.9,-2 -2,-2zM12,2c0.55,0 1,0.45 1,1s-0.45,1 -1,1 -1,-0.45 -1,-1 0.45,-1 1,-1z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/robot_icon.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFC107" android:pathData="M3,17.25V21h3.75L17.81,9.94l-3.75,-3.75L3,17.25z"/>
              <path android:fillColor="#FF5722" android:pathData="M20.71,7.04c0.39,-0.39 0.39,-1.02 0,-1.41l-2.34,-2.34c-0.39,-0.39 -1.02,-0.39 -1.41,0l-1.83,1.83 3.75,3.75 1.83,-1.83z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_notification.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M3,17.25V21h3.75L17.81,9.94l-3.75,-3.75L3,17.25zM20.71,7.04c0.39,-0.39 0.39,-1.02 0,-1.41l-2.34,-2.34c-0.39,-0.39 -1.02,-0.39 -1.41,0l-1.83,1.83 3.75,3.75 1.83,-1.83z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_check_green.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="100dp" android:height="100dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#4CAF50" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,17l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_close_red.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="100dp" android:height="100dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FF1744" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM17,15.59L15.59,17 12,13.41 8.41,17 7,15.59 10.59,12 7,8.41 8.41,7 12,10.59 15.59,7 17,8.41 13.41,12 17,15.59z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_close_x.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FF1744" android:pathData="M19,6.41L17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/bg_gradient_blue.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#00B8D4" android:endColor="#006064" android:angle="45" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/bg_menu_white.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF"/>
              <corners android:radius="24dp"/>
              <stroke android:width="1dp" android:color="#E0E0E0"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/bg_scan_box.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <stroke android:width="3dp" android:color="#00E5FF"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF

          cat > app/src/main/res/anim/floating_anim.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:interpolator="@android:anim/accelerate_decelerate_interpolator">
              <translate
                  android:fromYDelta="0%"
                  android:toYDelta="-8%"
                  android:duration="1000"
                  android:repeatMode="reverse"
                  android:repeatCount="infinite"/>
          </set>
          EOF

          cat > app/src/main/res/anim/zoom_in.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <scale xmlns:android="http://schemas.android.com/apk/res/android" android:duration="500" android:fromXScale="0.0" android:fromYScale="0.0" android:toXScale="1.0" android:toYScale="1.0" android:pivotX="50%" android:pivotY="50%" android:interpolator="@android:anim/overshoot_interpolator" />
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/bg_gradient_blue">

              <LinearLayout android:id="@+id/layoutForm"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:padding="24dp"
                  android:layout_centerInParent="true">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="@drawable/bg_menu_white"
                      android:padding="24dp"
                      android:elevation="12dp">
                      <TextView android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Belajar"
                          android:textColor="#4CAF50"
                          android:textSize="32sp"
                          android:textStyle="bold"
                          android:layout_gravity="center"
                          android:layout_marginBottom="24dp"/>
                      <EditText android:id="@+id/etLicenseKey"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:hint="Masukkan Kode Akses"
                          android:textColorHint="#999999"
                          android:textColor="#333333"
                          android:backgroundTint="#4CAF50"
                          android:layout_marginBottom="16dp"/>
                      <EditText android:id="@+id/etApiKey"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:hint="Masukkan API Key OpenRouter"
                          android:textColorHint="#999999"
                          android:textColor="#333333"
                          android:backgroundTint="#4CAF50"
                          android:layout_marginBottom="24dp"/>
                      <Button android:id="@+id/btnStart"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Verifikasi Kode"
                          android:backgroundTint="#4CAF50"
                          android:textColor="#FFFFFF"
                          android:textStyle="bold"/>
                  </LinearLayout>
              </LinearLayout>

              <ScrollView android:id="@+id/layoutAnim"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone"
                  android:background="#CC000000">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="24dp"
                      android:gravity="center_horizontal">
                      
                      <ImageView android:id="@+id/imgAnim"
                          android:layout_width="100dp"
                          android:layout_height="100dp" />
                      <TextView android:id="@+id/tvAnimText"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:textSize="20sp"
                          android:textStyle="bold"
                          android:textColor="#FFFFFF"
                          android:layout_marginTop="16dp"
                          android:layout_marginBottom="24dp"
                          android:gravity="center"/>

                      <LinearLayout
                          android:id="@+id/layoutFeatureList"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:background="@drawable/bg_menu_white"
                          android:padding="16dp"
                          android:layout_marginBottom="16dp">
                          
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:layout_marginBottom="12dp">
                              <TextView android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="Pilih Fitur Aktif:" android:textSize="16sp" android:textStyle="bold" android:textColor="#333333"/>
                              <Button android:id="@+id/btnSelectAll" android:layout_width="wrap_content" android:layout_height="35dp" android:text="Pilih Semua" android:textSize="10sp" android:backgroundTint="#00E5FF" android:textColor="#000000"/>
                          </LinearLayout>

                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="8dp">
                              <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@drawable/ic_pen" android:layout_marginEnd="12dp"/>
                              <TextView android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="Jawab Singkat" android:textColor="#333333"/>
                              <CheckBox android:id="@+id/cbJawab" android:layout_width="wrap_content" android:layout_height="wrap_content" android:checked="true"/>
                          </LinearLayout>
                          
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="8dp">
                              <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@drawable/ic_book" android:layout_marginEnd="12dp"/>
                              <TextView android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="Penjelasan" android:textColor="#333333"/>
                              <CheckBox android:id="@+id/cbPenjelasan" android:layout_width="wrap_content" android:layout_height="wrap_content" android:checked="true"/>
                          </LinearLayout>

                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="8dp">
                              <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@drawable/ic_chat" android:layout_marginEnd="12dp"/>
                              <TextView android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="Jawab Esai" android:textColor="#333333"/>
                              <CheckBox android:id="@+id/cbEsai" android:layout_width="wrap_content" android:layout_height="wrap_content" android:checked="true"/>
                          </LinearLayout>

                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="8dp">
                              <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@drawable/ic_search" android:layout_marginEnd="12dp"/>
                              <TextView android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="Scan Cepat" android:textColor="#333333"/>
                              <CheckBox android:id="@+id/cbScan" android:layout_width="wrap_content" android:layout_height="wrap_content" android:checked="true"/>
                          </LinearLayout>

                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="8dp">
                              <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@drawable/ic_clipboard" android:layout_marginEnd="12dp"/>
                              <TextView android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="Auto Copy" android:textColor="#333333"/>
                              <CheckBox android:id="@+id/cbAutoCopy" android:layout_width="wrap_content" android:layout_height="wrap_content" android:checked="true"/>
                          </LinearLayout>

                      </LinearLayout>

                      <Button android:id="@+id/btnActivateRobot"
                          android:layout_width="match_parent"
                          android:layout_height="50dp"
                          android:text="🚀 Aktifkan Robot"
                          android:backgroundTint="#00E5FF"
                          android:textColor="#000000"
                          android:textStyle="bold"
                          android:textSize="16sp"
                          android:layout_marginBottom="24dp"/>
                  </LinearLayout>
              </ScrollView>

              <TextView android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="DEVELOPER KELZZZ"
                  android:textColor="#FFFFFF"
                  android:textSize="14sp"
                  android:textStyle="bold"
                  android:layout_alignParentBottom="true"
                  android:layout_centerHorizontal="true"
                  android:layout_marginBottom="24dp"/>
          </RelativeLayout>
          EOF

          cat > app/src/main/res/layout/floating_bubble.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <ImageView android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:src="@drawable/robot_icon"
                  android:scaleType="fitCenter"/>
          </FrameLayout>
          EOF

          cat > app/src/main/res/layout/floating_menu.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="280dp"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:background="@drawable/bg_menu_white"
              android:padding="16dp"
              android:elevation="8dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:layout_marginBottom="8dp">
                  
                  <TextView
                      android:layout_width="0dp"
                      android:layout_weight="1"
                      android:layout_height="wrap_content"
                      android:text="Menu AI"
                      android:textColor="#4CAF50"
                      android:textSize="16sp"
                      android:textStyle="bold"/>

                  <ImageView
                      android:id="@+id/btnCloseMenuX"
                      android:layout_width="32dp"
                      android:layout_height="32dp"
                      android:padding="4dp"
                      android:src="@drawable/ic_close_x"
                      android:background="?android:attr/selectableItemBackgroundBorderless"/>
              </LinearLayout>

              <LinearLayout android:id="@+id/menuNotif"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="8dp"
                  android:background="#F5F5F5">
                  
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical">
                      <TextView android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="🔔"
                          android:textSize="24sp"
                          android:layout_marginEnd="12dp"/>
                      <TextView android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="wrap_content"
                          android:text="Aktifkan Jawaban Notifikasi"
                          android:textColor="#333333"
                          android:textSize="14sp"
                          android:textStyle="bold"/>
                      <Switch android:id="@+id/switchNotifJawaban"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"/>
                  </LinearLayout>

                  <RadioGroup
                      android:id="@+id/radioGroupNotifMode"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:paddingStart="36dp"
                      android:paddingTop="8dp"
                      android:visibility="gone">
                      
                      <RadioButton android:id="@+id/radioNotifSingkat"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
