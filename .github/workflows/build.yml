          package com.example.floatai

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.View
          import android.view.animation.AnimationUtils
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {
              private val projectionManager by lazy {
                  getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val etLicense = findViewById<EditText>(R.id.etLicenseKey)
                  val etApiKey = findViewById<EditText>(R.id.etApiKey)
                  val layoutForm = findViewById<LinearLayout>(R.id.layoutForm)
                  val layoutAnim = findViewById<ScrollView>(R.id.layoutAnim)
                  val imgAnim = findViewById<ImageView>(R.id.imgAnim)
                  val tvAnimText = findViewById<TextView>(R.id.tvAnimText)
                  val btnActivate = findViewById<Button>(R.id.btnActivateRobot)

                  val cbJawab = findViewById<CheckBox>(R.id.cbJawab)
                  val cbPenjelasan = findViewById<CheckBox>(R.id.cbPenjelasan)
                  val cbEsai = findViewById<CheckBox>(R.id.cbEsai)
                  val cbScan = findViewById<CheckBox>(R.id.cbScan)
                  val cbAutoCopy = findViewById<CheckBox>(R.id.cbAutoCopy)
                  val btnSelectAll = findViewById<Button>(R.id.btnSelectAll)

                  val prefs = getSharedPreferences("FloatAIPrefs", MODE_PRIVATE)
                  etApiKey.setText(prefs.getString("api_key", ""))

                  cbJawab.isChecked = prefs.getBoolean("feat_jawab", true)
                  cbPenjelasan.isChecked = prefs.getBoolean("feat_penjelasan", true)
                  cbEsai.isChecked = prefs.getBoolean("feat_esai", true)
                  cbScan.isChecked = prefs.getBoolean("feat_scan", true)
                  cbAutoCopy.isChecked = prefs.getBoolean("feat_autocopy", true)

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      val inputKey = etLicense.text.toString().trim().uppercase()
                      val apiKey = etApiKey.text.toString().trim()

                      layoutForm.visibility = View.GONE
                      layoutAnim.visibility = View.VISIBLE
                      btnActivate.visibility = View.GONE

                      var isValid = false
                      var pesanError = "Kode Salah / API Key tidak valid!"

                      if (apiKey.isEmpty() || !apiKey.startsWith("sk-or-")) {
                          pesanError = "API Key OpenRouter tidak valid!"
                      } else {
                          val savedKey = prefs.getString("license_key", "")
                          val expireDateStr = prefs.getString("license_expire", "")
                          val currentDate = Date()

                          if (inputKey.startsWith("PRM-")) {
                              isValid = true
                          } else if (inputKey.startsWith("TRL-")) {
                              if (savedKey == inputKey) {
                                  if (expireDateStr.isNotEmpty()) {
                                      try {
                                          val format = SimpleDateFormat("yyyy-MM-dd", Locale.getDefault())
                                          val expireDate = format.parse(expireDateStr)
                                          
                                          if (currentDate.after(expireDate)) {
                                              pesanError = "❌ Kode Trial Expired!\nMasa aktif sudah habis."
                                              isValid = false
                                          } else {
                                              isValid = true
                                          }
                                      } catch (e: Exception) {
                                          isValid = false
                                      }
                                  } else {
                                      isValid = false
                                  }
                              } else {
                                  var daysToAdd = 1
                                  if (inputKey.contains("-3D-")) daysToAdd = 3
                                  else if (inputKey.contains("-6D-")) daysToAdd = 6
                                  
                                  val calendar = Calendar.getInstance()
                                  calendar.add(Calendar.DAY_OF_YEAR, daysToAdd)
                                  val expireDate = calendar.time
                                  val format = SimpleDateFormat("yyyy-MM-dd", Locale.getDefault())
                                  
                                  prefs.edit()
                                      .putString("license_key", inputKey)
                                      .putString("license_expire", format.format(expireDate))
                                      .apply()
                                  isValid = true
                              }
                          } else {
                              pesanError = "Format Kode Akses tidak dikenali!\nGunakan awalan TRL- atau PRM-"
                          }
                      }

                      if (isValid) {
                          imgAnim.setImageResource(R.drawable.ic_check_green)
                          tvAnimText.text = "Kode Valid!\nAPI Key tersimpan."
                          tvAnimText.setTextColor(android.graphics.Color.parseColor("#4CAF50"))
                          
                          prefs.edit()
                              .putString("api_key", apiKey)
                              .apply()

                          Handler(Looper.getMainLooper()).postDelayed({
                              btnActivate.visibility = View.VISIBLE
                          }, 600)
                      } else {
                          imgAnim.setImageResource(R.drawable.ic_close_red)
                          tvAnimText.text = pesanError
                          tvAnimText.setTextColor(android.graphics.Color.parseColor("#FF1744"))
                      }

                      val anim = AnimationUtils.loadAnimation(this, R.anim.zoom_in)
                      imgAnim.startAnimation(anim)
                      tvAnimText.startAnimation(anim)
                  }

                  btnSelectAll.setOnClickListener {
                      val allChecked = cbJawab.isChecked && cbPenjelasan.isChecked && cbEsai.isChecked && cbScan.isChecked && cbAutoCopy.isChecked
                      val newState = !allChecked
                      cbJawab.isChecked = newState
                      cbPenjelasan.isChecked = newState
                      cbEsai.isChecked = newState
                      cbScan.isChecked = newState
                      cbAutoCopy.isChecked = newState
                  }

                  btnActivate.setOnClickListener {
                      prefs.edit()
                          .putBoolean("feat_jawab", cbJawab.isChecked)
                          .putBoolean("feat_penjelasan", cbPenjelasan.isChecked)
                          .putBoolean("feat_esai", cbEsai.isChecked)
                          .putBoolean("feat_scan", cbScan.isChecked)
                          .putBoolean("feat_autocopy", cbAutoCopy.isChecked)
                          .apply()
                      startRobot()
                  }
              }

              private fun startRobot() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Izinkan overlay dulu!", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 200)
                  }
                  startActivityForResult(projectionManager.createScreenCaptureIntent(), 1001)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1001 && resultCode == RESULT_OK && data != null) {
                      ScreenCaptureHelper.resultCode = resultCode
                      ScreenCaptureHelper.data = data
                      val intent = Intent(this, FloatingService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                      finish()
                  }
              }
          }
          EOF

