                              Toast.makeText(this, "Jawaban Notifikasi Aktif", Toast.LENGTH_SHORT).show()
                          } else {
                              Toast.makeText(this, "Jawaban Notifikasi Mati", Toast.LENGTH_SHORT).show()
                          }
                      }

                      radioGroupNotif.setOnCheckedChangeListener { _, checkedId ->
                          when (checkedId) {
                              R.id.radioNotifSingkat -> notifMode = "SINGKAT"
                              R.id.radioNotifPenjelasan -> notifMode = "PENJELASAN"
                              R.id.radioNotifEsai -> notifMode = "ESAI"
                          }
                      }
                  } else {
                      menuView!!.findViewById<LinearLayout>(R.id.menuNotif).visibility = View.GONE
                  }

                  if (featScan) {
                      menuView!!.findViewById<LinearLayout>(R.id.menuScan).setOnClickListener {
                          closeMenu(); openScanScreen("JAWAB")
                      }
                  } else {
                      menuView!!.findViewById<LinearLayout>(R.id.menuScan).visibility = View.GONE
                  }

                  if (featJawab) {
                      menuView!!.findViewById<LinearLayout>(R.id.menuJawab).setOnClickListener {
                          closeMenu(); checkCooldownAndProceed("JAWAB")
                      }
                  } else {
                      menuView!!.findViewById<LinearLayout>(R.id.menuJawab).visibility = View.GONE
                  }

                  if (featPenjelasan) {
                      menuView!!.findViewById<LinearLayout>(R.id.menuPenjelasan).setOnClickListener {
                          closeMenu(); checkCooldownAndProceed("PENJELASAN")
                      }
                  } else {
                      menuView!!.findViewById<LinearLayout>(R.id.menuPenjelasan).visibility = View.GONE
                  }

                  if (featEsai) {
                      menuView!!.findViewById<LinearLayout>(R.id.menuEsai).setOnClickListener {
                          closeMenu(); checkCooldownAndProceed("ESAI")
                      }
                  } else {
                      menuView!!.findViewById<LinearLayout>(R.id.menuEsai).visibility = View.GONE
