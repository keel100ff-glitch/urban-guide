              private fun hideLoadingView() {
                  if (loadingView != null) {
                      try { windowManager.removeView(loadingView) } catch (_: Exception) {}
                      loadingView = null
                  }
              }

              private fun showLoadingAndCapture(mode: String) {
                  showLoadingWithMessage("AI memproses...", false)
                  Handler(Looper.getMainLooper()).postDelayed({ captureAndSolve(mode) }, 500)
              }

              private fun captureAndSolve(mode: String) {
                  try {
                      val data = ScreenCaptureHelper.data
                      if (data == null) {
                          hideLoadingView()
                          showResult("Data screen capture hilang. Silakan restart app.")
                          return
                      }
                      val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager

                      releaseProjection()
                      mediaProjection = mpManager.getMediaProjection(ScreenCaptureHelper.resultCode, data)
                      if (mediaProjection == null) {
                          hideLoadingView()
                          showResult("Gagal dapat MediaProjection.")
                          return
                      }
                      mediaProjection!!.registerCallback(projectionCallback, Handler(Looper.getMainLooper()))

                      val metrics = resources.displayMetrics
                      val w = metrics.widthPixels
                      val h = metrics.heightPixels
                      val density = metrics.densityDpi

                      imageReader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                      virtualDisplay = mediaProjection!!.createVirtualDisplay(
                          "cap", w, h, density,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          imageReader!!.surface, null, null
                      )

                      thread {
                          try {
                              Thread.sleep(300)
                              val image = imageReader?.acquireLatestImage()
                              if (image == null) {
                                  Handler(Looper.getMainLooper()).post {
                                      hideLoadingView()
                                      showResult("Gagal ambil frame. Coba lagi.")
                                  }
                                  return@thread
                              }
                              val planes = image.planes
                              val buffer = planes[0].buffer
                              val pixelStride = planes[0].pixelStride
                              val rowStride = planes[0].rowStride
                              val rowPadding = rowStride - pixelStride * w
                              val bitmap = Bitmap.createBitmap(
                                  w + rowPadding / pixelStride, h, Bitmap.Config.ARGB_8888
                              )
                              bitmap.copyPixelsFromBuffer(buffer)
                              image.close()
                              
                              var finalBitmap = bitmap
                              if (scanRect != null) {
                                  val rect = scanRect!!
                                  val left = rect.left.coerceIn(0, w - 1)
                                  val top = rect.top.coerceIn(0, h - 1)
                                  val right = rect.right.coerceIn(left + 1, w)
                                  val bottom = rect.bottom.coerceIn(top + 1, h)
                                  val width = right - left
                                  val height = bottom - top
                                  
                                  try {
                                      finalBitmap = Bitmap.createBitmap(bitmap, left, top, width, height)
                                  } catch (e: Exception) {
                                      finalBitmap = bitmap 
                                  }
                              }
                              scanRect = null
                              
                              processImageWithOCR(finalBitmap, mode)
                              
                          } catch (e: Exception) {
                              Handler(Looper.getMainLooper()).post {
                                  hideLoadingView()
                                  showResult("Gagal memotret layar: ${e.message}")
                              }
                          } finally {
                              releaseProjection()
                          }
                      }
                  } catch (e: Exception) {
                      hideLoadingView()
                      showResult("Error Capture: ${e.message}")
                  }
              }

              private fun processImageWithOCR(bitmap: Bitmap, mode: String) {
                  val image = InputImage.fromBitmap(bitmap, 0)
                  val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)

                  recognizer.process(image)
                      .addOnSuccessListener { visionText ->
                          val recognizedText = visionText.text
                          askAIWithImage(bitmap, mode, recognizedText)
                      }
                      .addOnFailureListener { e ->
                          askAIWithImage(bitmap, mode, "")
                      }
              }

              private fun askAIWithImage(bitmap: Bitmap, mode: String, extractedText: String) {
                  thread {
                      try {
                          val maxDim = 720 
                          val scale = if (bitmap.width > bitmap.height) maxDim.toFloat() / bitmap.width else maxDim.toFloat() / bitmap.height
                          val resizedBitmap = if (scale < 1.0f) {
                              Bitmap.createScaledBitmap(bitmap, (bitmap.width * scale).toInt(), (bitmap.height * scale).toInt(), true)
                          } else {
                              bitmap
                          }

                          val stream = ByteArrayOutputStream()
                          resizedBitmap.compress(Bitmap.CompressFormat.JPEG, 60, stream) 
                          val base64Image = Base64.encodeToString(stream.toByteArray(), Base64.NO_WRAP)

                          var finalPrompt = when (mode) {
                              "JAWAB" -> "Baca soal pada gambar dengan teliti. Berikan jawaban HANYA untuk soal bernomor yang terlihat utuh (ada pertanyaan dan pilihan jawabannya). Jika ada soal yang terpotong atau tidak lengkap, JANGAN dijawab. Format jawaban: No [nomor] ([jawaban]). Contoh: No 1 (A), No 2 (C)."
                              "PENJELASAN" -> "Baca soal pada gambar. Berikan jawaban akhirnya, lalu jelaskan secara SINGKAT kenapa jawaban itu benar. Maksimal 3-4 baris kalimat."
                              "ESAI" -> "Baca soal esai pada gambar. Berikan jawaban esai yang JELAS dan LENGKAP namun tidak terlalu panjang. Sertakan cara/langkah penyelesaiannya secara singkat (misalnya: 1+1=2, jelaskan cara mendapatkannya), lalu akhiri dengan jawaban akhir."
                              else -> "Baca soal pada gambar. Berikan jawaban yang sesuai."
                          }

                          if (extractedText.isNotBlank()) {
                              finalPrompt += "\n\nTeks yang terbaca dari layar (gunakan sebagai referensi tambahan jika gambar kurang jelas):\n\"$extractedText\""
                          }

                          val url = URL("https://openrouter.ai/api/v1/chat/completions")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Authorization", "Bearer $API_KEY")
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.connectTimeout = 15000
                          conn.readTimeout = 30000
                          conn.doOutput = true

                          val messages = JSONArray()
                          val userMsg = JSONObject().apply {
                              put("role", "user")
                              val content = JSONArray()
                              content.put(JSONObject().apply {
                                  put("type", "text")
                                  put("text", finalPrompt)
                              })
                              content.put(JSONObject().apply {
                                  put("type", "image_url")
                                  put("image_url", JSONObject().apply {
                                      put("url", "data:image/jpeg;base64,$base64Image")
                                  })
                              })
                              put("content", content)
                          }
                          messages.put(userMsg)

                          val body = JSONObject().apply {
                              put("model", "openai/gpt-4o-mini")
                              put("messages", messages)
                              put("temperature", 0.3) 
                              put("max_tokens", 1024)
                          }

                          OutputStreamWriter(conn.outputStream).use { it.write(body.toString()) }

                          val responseCode = conn.responseCode
                          val inputStream = if (responseCode in 200..299) conn.inputStream else conn.errorStream
                          val reader = BufferedReader(InputStreamReader(inputStream))
                          val response = reader.readText()
                          reader.close()
                          conn.disconnect()

                          if (responseCode == 429) { 
                              cooldownEndTime = System.currentTimeMillis() + (60L * 1000)
                              
                              Handler(Looper.getMainLooper()).post {
                                  hideLoadingView()
                                  showResult("⚠️ Token Habis\n\nKuota AI hari ini sudah habis. Token akan reset otomatis di atas jam 07:00 pagi (WIB).\n\nSilakan tunggu besok atau buat Akun/API Key baru biar bisa lanjut ujian.")
                              }
                              return@thread
                          } else if (responseCode !in 200..299) {
                              Handler(Looper.getMainLooper()).post {
                                  hideLoadingView()
                                  showResult("API Error ($responseCode): ${response.take(300)}")
                              }
                              return@thread
                          }

                          val jsonResponse = JSONObject(response)
                          val choices = jsonResponse.optJSONArray("choices")
                          val answerText = choices?.optJSONObject(0)
                              ?.optJSONObject("message")
                              ?.optString("content")
                              ?: "Tidak ada jawaban."

                          Handler(Looper.getMainLooper()).post {
                              hideLoadingView()
                              showResult(answerText.trim())
                          }
                      } catch (e: Exception) {
                          Handler(Looper.getMainLooper()).post {
                              hideLoadingView()
                              showResult("Error: ${e.message}")
                          }
                      }
                  }
              }

              private fun askAIWithText(questionText: String, mode: String) {
                  thread {
                      try {
                          var finalPrompt = when (mode) {
                              "JAWAB", "SINGKAT" -> "Baca soal berikut dengan teliti. Berikan jawaban HANYA untuk soal bernomor yang terlihat utuh (ada pertanyaan dan pilihan jawabannya). Jika ada soal yang terpotong atau tidak lengkap, JANGAN dijawab. Format jawaban: No [nomor] ([jawaban]). Contoh: No 1 (A), No 2 (C).\n\nSoal:\n$questionText"
                              "PENJELASAN" -> "Baca soal berikut. Berikan jawaban akhirnya, lalu jelaskan secara SINGKAT kenapa jawaban itu benar. Maksimal 3-4 baris kalimat.\n\nSoal:\n$questionText"
                              "ESAI" -> "Baca soal esai berikut. Berikan jawaban esai yang JELAS dan LENGKAP namun tidak terlalu panjang. Sertakan cara/langkah penyelesaiannya secara singkat (misalnya: 1+1=2, jelaskan cara mendapatkannya), lalu akhiri dengan jawaban akhir.\n\nSoal:\n$questionText"
                              else -> "Baca soal berikut. Berikan jawaban yang sesuai.\n\nSoal:\n$questionText"
                          }

                          val url = URL("https://openrouter.ai/api/v1/chat/completions")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Authorization", "Bearer $API_KEY")
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.connectTimeout = 15000
                          conn.readTimeout = 30000
                          conn.doOutput = true

                          val messages = JSONArray()
                          val userMsg = JSONObject().apply {
                              put("role", "user")
                              put("content", finalPrompt)
                          }
                          messages.put(userMsg)

                          val body = JSONObject().apply {
                              put("model", "openai/gpt-4o-mini")
                              put("messages", messages)
                              put("temperature", 0.3) 
                              put("max_tokens", 1024)
                          }

                          OutputStreamWriter(conn.outputStream).use { it.write(body.toString()) }

                          val responseCode = conn.responseCode
                          val inputStream = if (responseCode in 200..299) conn.inputStream else conn.errorStream
                          val reader = BufferedReader(InputStreamReader(inputStream))
                          val response = reader.readText()
                          reader.close()
                          conn.disconnect()

                          if (responseCode == 429) {
                              Handler(Looper.getMainLooper()).post {
                                  showResult("⚠️ Token Habis\n\nKuota AI hari ini sudah habis. Token akan reset otomatis di atas jam 07:00 pagi (WIB).\n\nSilakan tunggu besok atau buat Akun/API Key baru biar bisa lanjut ujian.")
                              }
                              return@thread
                          } else if (responseCode !in 200..299) {
                              Handler(Looper.getMainLooper()).post {
                                  showResult("API Error ($responseCode): ${response.take(300)}")
                              }
                              return@thread
                          }

                          val jsonResponse = JSONObject(response)
                          val choices = jsonResponse.optJSONArray("choices")
                          val answerText = choices?.optJSONObject(0)
                              ?.optJSONObject("message")
                              ?.optString("content")
                              ?: "Tidak ada jawaban."

                          Handler(Looper.getMainLooper()).post {
                              showResult(answerText.trim())
                          }
                      } catch (e: Exception) {
                          Handler(Looper.getMainLooper()).post {
                              showResult("Error: ${e.message}")
                          }
                      }
                  }
              }

              private fun extractAnswerOnly(raw: String): String {
                  val text = raw.trim()
                  if (text.isEmpty()) return text
                  val noPattern = Regex("""(?i)\bNo\s*\d+\s*[\(\:]?\s*[A-Ea-e0-9]+\)?""")
                  val noMatches = noPattern.findAll(text).map { it.value }.toList()
                  if (noMatches.isNotEmpty()) return noMatches.joinToString(", ")
                  val lines = text.lines().map { it.trim() }.filter { it.isNotEmpty() }
                  val jawabanLine = lines.lastOrNull {
                      it.startsWith("Jawaban", ignoreCase = true) ||
                      it.startsWith("Jawaban Akhir", ignoreCase = true) ||
                      it.startsWith("**Jawaban", ignoreCase = true)
                  }
                  if (jawabanLine != null) {
                      return jawabanLine
                          .replace(Regex("""(?i)^\**jawaban(\s*akhir)?\**\s*[:\-]?\s*"""), "")
                          .replace(Regex("""[*_`]"""), "")
                          .trim()
                  }
                  return lines.lastOrNull()?.replace(Regex("""[*_`]"""), "")?.trim() ?: text
              }

              private fun showResult(text: String) {
                  lastAnswer = text

                  if (isNotifEnabled) {
                      val answerOnly = extractAnswerOnly(text)
                      val cmAuto = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cmAuto.setPrimaryClip(ClipData.newPlainText("Belajar", answerOnly))
                      showResultNotification(text)
                  } else {
                      closeAnswer()
                      answerView = LayoutInflater.from(this).inflate(R.layout.floating_answer, null)
                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      )
                      params.gravity = Gravity.CENTER

                      answerView!!.findViewById<TextView>(R.id.tvAnswer).text = text

                      answerView!!.findViewById<Button>(R.id.btnCopyAnswer).setOnClickListener {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          val ans = extractAnswerOnly(lastAnswer)
                          cm.setPrimaryClip(ClipData.newPlainText("Belajar", ans))
                          Toast.makeText(this, "Jawaban disalin: $ans", Toast.LENGTH_SHORT).show()
                      }
                      
                      answerView!!.findViewById<Button>(R.id.btnCopy).setOnClickListener {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("Belajar", lastAnswer))
                          Toast.makeText(this, "Tersalin!", Toast.LENGTH_SHORT).show()
                      }
                      
                      answerView!!.findViewById<ImageView>(R.id.btnCloseX).setOnClickListener {
                          closeAnswer()
                      }
                      
                      answerView!!.findViewById<Button>(R.id.btnClose).setOnClickListener {
                          closeAnswer()
                      }
                      
                      windowManager.addView(answerView, params)
                  }
              }
          }
          EOF

      - name: Setup Gradle Action
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Belajar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
