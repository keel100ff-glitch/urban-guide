                  menuView = LayoutInflater.from(this).inflate(R.layout.floating_menu, null)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.CENTER

                  menuView!!.findViewById<ImageView>(R.id.btnCloseMenuX).setOnClickListener {
                      closeMenu()
                  }

                  if (featAutoCopy) {
                      val switchNotif = menuView!!.findViewById<Switch>(R.id.switchNotifJawaban)
                      val radioGroupNotif = menuView!!.findViewById<RadioGroup>(R.id.radioGroupNotifMode)
                      
                      switchNotif.isChecked = isNotifEnabled
                      radioGroupNotif.visibility = if (isNotifEnabled) View.VISIBLE else View.GONE
                      
                      when (notifMode) {
                          "SINGKAT" -> radioGroupNotif.check(R.id.radioNotifSingkat)
                          "PENJELASAN" -> radioGroupNotif.check(R.id.radioNotifPenjelasan)
                          "ESAI" -> radioGroupNotif.check(R.id.radioNotifEsai)
                      }

                      switchNotif.setOnCheckedChangeListener { _, isChecked ->
